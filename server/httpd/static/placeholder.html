<!doctype html>
<!--
  占位页。**这个文件入库，且永远不会被构建产物覆盖**（产物叫 index.html）。

  它存在有两个作用：
  1. 让 go:embed 有东西可嵌 —— static/ 目录若为空，`go build ./cmd/amad` 会报
     "static: no matching files found" 直接失败，而那个报错不提示「该先构建前端」。
  2. 没跑过 dev.sh 就启动时，给一个说得清原因的页面，而不是空白或裸 404。

  刻意**不叫 index.html**：那个名字属于 vite 产物，构建时会被覆盖，于是「入库的占位文件」
  和「不该入库的产物」变成同一个路径，git 里就永远有一份构建产物待提交。
  分开命名之后 static/.gitignore 才能干净地只放行这一个文件。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AMA · 前端尚未构建</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f8;
        color: #16181a;
        font: 14px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      main { max-width: 34rem; padding: 2rem; }
      h1 { margin: 0 0 0.75rem; font-size: 1.125rem; }
      p { margin: 0 0 1rem; color: #5c6166; }
      pre {
        margin: 0;
        padding: 0.875rem 1rem;
        border-radius: 8px;
        background: #16181a;
        color: #e8eaed;
        font-size: 13px;
        overflow-x: auto;
      }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .hint { margin-top: 1rem; font-size: 13px; color: #8a9199; }
    </style>
  </head>
  <body>
    <main>
      <h1>前端尚未构建</h1>
      <p>
        后端已经在跑，但二进制里没有前端产物 —— 说明它是在没跑过 dev.sh 的情况下
        编译出来的。在仓库根执行：
      </p>
      <pre><code>./dev.sh</code></pre>
      <p class="hint">
        它会构建前端、把产物嵌进后端、然后重启单进程服务。<br />
        接口本身不受影响，可以先用 <code>/api/workspaces</code> 验证后端是否正常。
      </p>
    </main>
  </body>
</html>
